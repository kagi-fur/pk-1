<head>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>title</title>
<style>
body{
	background-color: lightblue;
	font-family: 'Prompt', 'Sarabun', Tahoma, sans-serif;
	line-height: 1.6;
}
img{
	background-color: none;	
}
.top{
	display: flex;	
	align-items: center;	
	justify-content: between;
}
.link{
	margin-left: 20%;
}
a{
	text-decoration: none;
	border: 1px lightblue solid;
	border-radius: 10px;
	padding: 5px;
	color: #1a252f;
	transition: 0.5s;
}
a:hover{
	color: black;
	background-color: white;
	transform: scale(1.02);
	box-shadow: 3px 3px;
}
a:active{
	color: gray;
	background-color:none;
	transform: scale(1);
	box-shadow: none;
}
@keyframes spin{
from{
	transform: rotate(0deg);	
}to{
	transform: rotate(360deg);
}
}
.rotate{
	transition: 0.5s;
}
.rolate:hover{
	animation: spin 0.5s linear infinite;
	cursor: pointer;
}
</style>
</head>
<body>
	<div class="top">
		<img src="../pk/pic/chaiyaphum-icon.jpg" width="50" height="50" style="padding-right:10px" class="rolate">

		</div>
	</div>
</body>
</html>
